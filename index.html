<style>
@font-face{font-family:PS2P;src:url(PressStart2P.ttf);font-display:block}
/* --px = ein Game-Boy-Pixel; der Bildschirm ist immer 160 davon breit */
:root{--px:calc(min(100vw,60dvh)/160);--ink:#181030;--paper:#f8f8e8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--ink);font:calc(var(--px)*6)/1.5 PS2P,monospace;
  display:flex;justify-content:center;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#game{width:calc(var(--px)*160);height:100dvh;display:flex;flex-direction:column;background:var(--paper);
  padding-bottom:env(safe-area-inset-bottom)}

#scene{flex:1;min-height:calc(var(--px)*100);position:relative;overflow:hidden;display:grid;place-items:center;
  image-rendering:pixelated;border-bottom:calc(var(--px)*2) solid var(--ink);
  background:repeating-conic-gradient(#4ae4de 0 25%,#3ed6d0 0 50%) 0 0/calc(var(--px)*16) calc(var(--px)*16);
  animation:scroll 2s steps(8) infinite}
/* Szenenwechsel in groben Stufen wie auf dem Game Boy: rosa Grund blendet ein, Einhorn rutscht, Kopf faellt von oben rein */
#scene::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .6s steps(6);
  background:repeating-conic-gradient(#f4bbd0 0 25%,#f7c9da 0 50%) 0 0/calc(var(--px)*16) calc(var(--px)*16)}
#scene.uni::before,#scene.bier::before{opacity:1}
#uni{position:absolute;inset:0;margin:auto;width:calc(var(--px)*108);height:calc(var(--px)*102);image-rendering:pixelated;
  translate:-160% 0;transition:translate .6s steps(10)}
#scene.uni #uni,#scene.bier #uni{translate:0 0}
/* Titelbild: Einhorn tanzt ueber den Regenbogen hin und her (transform = Weg + Blickrichtung, translate = Huepfer) */
#bow{position:absolute;left:0;bottom:0;width:100%;image-rendering:pixelated;display:none}
#title:not([hidden])~#bow{display:block}
#title:not([hidden])~#uni{margin-bottom:calc(var(--px)*40);animation:dance 5s linear infinite,hop .3s steps(2) infinite alternate}
@keyframes hop{to{translate:0 calc(var(--px)*-5)}}
@keyframes dance{
  0%{transform:translate(calc(var(--px)*-26),calc(var(--px)*2)) scaleX(-1)}
  12.5%{transform:translate(calc(var(--px)*-13),calc(var(--px)*1)) scaleX(-1)}
  25%{transform:translate(0,0) scaleX(-1)}
  37.5%{transform:translate(calc(var(--px)*13),calc(var(--px)*1)) scaleX(-1)}
  49.9%{transform:translate(calc(var(--px)*26),calc(var(--px)*2)) scaleX(-1)}
  50%{transform:translate(calc(var(--px)*26),calc(var(--px)*2))}
  62.5%{transform:translate(calc(var(--px)*13),calc(var(--px)*1))}
  75%{transform:translate(0,0)}
  87.5%{transform:translate(calc(var(--px)*-13),calc(var(--px)*1))}
  100%{transform:translate(calc(var(--px)*-26),calc(var(--px)*2))}
}
#scene.bier #uni{margin-left:calc(var(--px)*2)}
#scene.uni #head{translate:0 -260%}
@keyframes scroll{to{background-position:calc(var(--px)*16) calc(var(--px)*16)}}
#head{position:relative;width:calc(var(--px)*60);height:calc(var(--px)*93);image-rendering:pixelated;animation:bob 1.6s steps(4) infinite alternate;
  translate:0 0;transition:translate .6s steps(10)}
#scene.bier #head{position:absolute;right:calc(var(--px)*6);bottom:calc(var(--px)*4);width:calc(var(--px)*40);height:calc(var(--px)*62)}
@keyframes bob{from{transform:translateY(calc(var(--px)*-3))}to{transform:translateY(calc(var(--px)*3))}}
#title{position:absolute;top:calc(var(--px)*8);left:0;right:0;text-align:center;color:var(--paper);
  font-size:calc(var(--px)*11);line-height:1.3;white-space:nowrap;text-shadow:calc(var(--px)*1) calc(var(--px)*1) 0 var(--ink)}
#title small{display:block;font-size:calc(var(--px)*6);margin-top:calc(var(--px)*3)}

.box{font:inherit;color:inherit;text-align:left;background:var(--paper);border:calc(var(--px)*2) solid var(--ink);
  border-radius:calc(var(--px)*3);box-shadow:inset 0 0 0 calc(var(--px)*1) var(--paper),inset 0 0 0 calc(var(--px)*2) #a8a0c8;
  padding:calc(var(--px)*5) calc(var(--px)*6);margin:calc(var(--px)*2) calc(var(--px)*2) 0}
#box{height:calc(var(--px)*68);position:relative;display:flex;align-items:flex-start;width:calc(100% - var(--px)*4);
  hyphens:auto;overflow-wrap:break-word;overflow:hidden}
#rest{visibility:hidden}
#more{position:absolute;right:calc(var(--px)*5);bottom:calc(var(--px)*3);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

#choices{min-height:calc(var(--px)*82);display:flex;flex-direction:column;padding-bottom:calc(var(--px)*2)}
#choices button{cursor:pointer}
#choices button:active,#choices button:focus-visible{background:var(--ink);color:var(--paper);outline:0}
#choices.grid{display:grid;grid-template-columns:repeat(7,1fr);align-content:start}
#choices.grid button{text-align:center;padding:calc(var(--px)*4) 0;margin:calc(var(--px)*1)}
[hidden]{display:none!important}
/* 4. Durchlauf: nur noch ein riesiger JA-Knopf */

#game.full #choices{flex:1}
#game.full #choices button{flex:1;margin-bottom:calc(var(--px)*2);text-align:center;font-size:calc(var(--px)*56)}
@media (prefers-reduced-motion:reduce){#head,#scene,#uni{animation:none!important}#head,#uni,#scene::before{transition:none}}
.fast *,.fast *::before{transition:none!important}
</style>

// 20×31 Pixel, aus talking_head.jpeg abgetastet. '0' = durchsichtig.

  '00000011111000000000', '00000112222110000000', '00111221212211100000', '00011121112211110000',
  '11122111221131111000', '01222221122111422200', '11111112244444442210', '02221134445555554210',
  '11212444666666655611', '11244455555555556621', '12446666555566666621', '22445555655655555621',

  '00885881155118858800', '00881199999999118800', '00081114418441188000', '00081115118151188000',
  '00008111111111880000', '00000881888818800000', '00000008888880000000',
];
// Änderungen gegenüber HEAD als [Zeile, Spalte, Pixel]
const FACES = {
  neutral: [],
  happy: [[13, 4, '11111'], [14, 4, '55555'], [13, 11, '11111'], [14, 11, '66666'], [25, 6, '1'], [25, 13, '1'], [24, 6, '9'], [24, 13, '9']],
  smug: [[13, 11, '11111'], [14, 11, '66666'], [24, 14, '9']],
  annoyed: [[15, 8, '1'], [15, 11, '1'], [25, 6, '1'], [25, 13, '1'], [26, 6, '9'], [26, 13, '9']],
  surprised: [[13, 4, '11111'], [14, 4, '57375'], [13, 11, '11111'], [14, 11, '67376'], [25, 6, '11'], [25, 12, '11']],
};
const MOUTHS = [[], [[25, 8, '3333']], [[26, 7, '333333'], [27, 7, '999999']]];
const BLINK = [[15, 5, '888'], [15, 12, '888']];

const $ = id => document.getElementById(id);
const ctx = $('head').getContext('2d');
let face = 'neutral', mouth = 0, blink = false;

function draw() {
  const rows = HEAD.map(r => [...r]);
  const patches = [...FACES[face], ...MOUTHS[mouth], ...(blink ? BLINK : [])];
  for (const [r, c, px] of patches) [...px].forEach((p, i) => rows[r][c + i] = p);
  ctx.clearRect(0, 0, 20, 31);
  rows.forEach((row, y) => row.forEach((p, x) => { if (p != 0) { ctx.fillStyle = PAL[p]; ctx.fillRect(x, y, 1, 1); } }));
}
// gluck, gluck: im Bier-Bild wechseln die beiden Trink-Posen
setInterval(() => { if (node.scene === 'bier') $('uni').src = $('uni').src.includes('_1') ? 'einhorn_2.png' : 'einhorn_1.png'; }, 350);
setInterval(() => { blink = true; draw(); setTimeout(() => { blink = false; draw(); }, 140); }, 3300);

// ───────── DIALOG ─────────
const FAST = location.search.includes('fast');   // Testmodus: Text sofort komplett, keine Uebergaenge
document.documentElement.classList.toggle('fast', FAST);
const pick = () => NAMES[sex][Math.random() * NAMES[sex].length | 0];
let node, page, text, shown, timer, sex, name, typed = '';
// Zahl der Durchlaeufe gilt nur bis zum Neuladen der Seite
let runs = 0, level = 0;   // level = wie oft vor dem aktuellen Durchlauf schon gespielt wurde
try { localStorage.removeItem('runs'); } catch {}   // Rest aus einer frueheren Version aufraeumen
const pages = () => level >= 2 && node.third || level >= 1 && node.again || node.pages;

function go(id) {
  if (/^https?:/.test(id)) { location.href = id; return; }
  if (id === 'title') { level = runs; sex = Math.random() < .5 ? 'm' : 'f'; name = pick(); if (level >= 3) id = 'ja'; }
  if (id === 'hello') runs++;
  if (id === 'intro' && level === 2) id = 'third';
  node = STORY[id];
  $('game').classList.toggle('full', !!node.full);
  if (node.reroll) { sex = sex === 'm' ? 'f' : 'm'; name = pick(); }
  $('scene').className = node.scene || '';
  $('uni').src = node.scene === 'bier' ? 'einhorn_1.png' : 'einhorn_0.png';
  $('title').hidden = !node.title;
  $('choices').replaceChildren();
  $('choices').className = '';
  page = 0;
  showPage();
}

function showPage() {
  const p = pages()[page];
  $('box').hidden = !p;
  if (!p) { face = 'neutral'; draw(); return showChoices(); }
  face = p[0];
  text = p[1].replaceAll('{name}', name).replaceAll('{typed}', typed);
  shown = FAST ? text.length : 0;
  $('more').hidden = true;
  clearInterval(timer);
  timer = setInterval(type, 32);
  type();
}

function type() {
  shown = Math.min(shown + 1, text.length);
  // Rest unsichtbar mitsetzen, damit der Zeilenumbruch beim Tippen nicht springt
  $('said').textContent = text.slice(0, shown);
  $('rest').textContent = text.slice(shown);
  mouth = [1, 2, 1, 0][(shown >> 1) % 4];
  if (shown >= text.length) {
    clearInterval(timer);
    mouth = 0;
    const last = page === pages().length - 1;
    $('more').hidden = last && !node.next;
    if (last && !node.next) showChoices();
  }
  // spricht das Einhorn, huepft es im Takt (es hat keinen Mund)
  $('uni').style.transform = node.scene === 'uni' && mouth ? 'translateY(calc(var(--px)*-2))' : '';
  draw();
}

function advance() {
  if (!text || $('box').hidden) return;
  if (shown < text.length) { shown = text.length - 1; type(); }
  else if (page < pages().length - 1) { page++; showPage(); }
  else if (node.next) go(node.next);
}

function button(label, onclick) {
  const b = document.createElement('button');
  b.className = 'box';
  b.textContent = label;
  b.onclick = onclick;
  $('choices').append(b);
}

function showChoices() {
  if (node.input) {
    typed = '';
    $('choices').className = 'grid';
    $('said').textContent = 'NAME: _';
    for (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') button(ch, () => {
      typed += ch;
      $('said').textContent = 'NAME: ' + typed + '_';
      if (typed.length === 2) go(node.input);   // der Kopf verliert die Geduld
    });
  } else for (const [label, target] of node.choices) button(label, () => go(target));
}

$('box').onclick = $('scene').onclick = advance;

// Selbsttest: jedes Sprungziel muss existieren
for (const [id, n] of Object.entries(STORY))
  for (const t of [n.next, n.input, ...(n.choices || []).map(c => c[1])])
    console.assert(!t || STORY[t] || /^https?:/.test(t), `Knoten "${id}" zeigt auf unbekanntes Ziel "${t}"`);

go('title');
if (STORY[location.hash.slice(1)]) go(location.hash.slice(1));   // #knoten = Start an beliebiger Stelle (zum Testen)
</script>
</body>
</html>
